services:
  captcha:
    build: ./captcha-microservice
    container_name: maia-captcha
    volumes:
      - ./databases:/app/db
    ports:
      - "8001:8001"    #TODO remove at production, expose ports only for dev enviroment
    environment:
      - DATABASE_URL=sqlite:////app/db/captcha.db
    restart: always

  auth:
    build: ./auth-microservice
    container_name: maia-auth
    volumes:
      - ./databases:/app/db
    ports:
      - "8002:8002"    #TODO remove at production, expose ports only for dev enviroment
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/db/users.db
      - CAPTCHA_SERVICE_URL=http://captcha:8001/api/v1
    env_file:
      - ./auth-microservice/.env
    depends_on:
      - captcha
    restart: always

  sentences:
    build: ./sentences-microservice
    container_name: maia-sentences
    volumes:
      - ./databases:/app/db
    ports:
      - "8003:8003"    #TODO remove at production, expose ports only for dev enviroment
    environment:
      - DATABASE_URL=sqlite:////app/db/sentences.db
    restart: always

  todos:
    build: ./todo-microservice
    container_name: maia-todos
    volumes:
      - ./databases:/app/db  # To sprawi, że baza pojawi się obok innych!
    ports:
      - "8004:8004"    #TODO remove at production
    environment:
      # Podmieniamy lokalny URL bazy z .env na ścieżkę wewnątrz Dockera
      # 4 ukośniki (////) oznaczają ścieżkę absolutną w Linuksie!
      - DATABASE_URL=sqlite+aiosqlite:////app/db/todos.db
    env_file:
      - ./todo-microservice/.env # Zaczytuje SECRET_KEY i ALGORITHM
    restart: always

  projects:
    build: ./projects-microservice
    container_name: maia-projects
    volumes:
      - ./databases:/app/db
    ports:
      - "8005:8005"    #TODO remove at production
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/db/projects.db
    env_file:
      - ./projects-microservice/.env # SECRET_KEY i ALGORITHM (takie same jak w auth)
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - captcha
      - auth
      - sentences
      - todos
      - projects